name: trackskill

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackskill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackskill_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-trackskill}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trackskill} -d $${POSTGRES_DB:-trackskill}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@1234}
      USE_LIGHT_NLP: ${USE_LIGHT_NLP:-true}
      TRACER_PROVIDER: ${TRACER_PROVIDER:-simulated}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      TRACER_INTERVAL_SECONDS: ${TRACER_INTERVAL_SECONDS:-300}
      TRACER_EXPIRY_DAYS: ${TRACER_EXPIRY_DAYS:-14}
      TRACER_MAX_ATTEMPTS: ${TRACER_MAX_ATTEMPTS:-3}
      # Inside Docker the database host is always the "db" service. The
      # DATABASE_URL in .env is only used when running the API outside Docker.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trackskill}:${POSTGRES_PASSWORD:-trackskill_dev_password}@db:5432/${POSTGRES_DB:-trackskill}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      # Reliable hot reload for bind mounts on Windows/macOS.
      WATCHPACK_POLLING: "true"
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    command: npm run dev

volumes:
  db_data:
  web_node_modules:
  web_next_cache:
